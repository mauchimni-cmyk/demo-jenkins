<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <meta name="description" content="Celebrate the colors, culture, and hospitality of India.">
  <title>Welcome to India</title>
  <style>
    :root {
      color-scheme: light;
      --saffron: #e87524;
      --green: #187448;
      --navy: #183f73;
      --ink: #292821;
      --paper: #fffaf2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }

    .color-band {
      height: 12px;
      background: linear-gradient(to right, var(--saffron) 0 33.33%, #fff 33.33% 66.66%, var(--green) 66.66%);
    }

    header {
      display: flex;
      width: min(1120px, calc(100% - 48px));
      min-height: 88px;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto;
    }

    .brand {
      color: var(--navy);
      font-size: 1.1rem;
      font-weight: 750;
      letter-spacing: 0.04em;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: var(--ink);
      font-size: 0.95rem;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    main {
      position: relative;
      display: grid;
      flex: 1;
      place-items: center;
      padding: 72px 24px 88px;
      isolation: isolate;
    }

    main::before,
    main::after {
      position: absolute;
      z-index: -1;
      width: 390px;
      height: 390px;
      border: 1px solid rgba(24, 63, 115, 0.1);
      border-radius: 50%;
      content: "";
    }

    main::before {
      top: -190px;
      right: -130px;
      box-shadow: 0 0 0 24px rgba(24, 63, 115, 0.025), 0 0 0 48px rgba(24, 63, 115, 0.025);
    }

    main::after {
      bottom: -250px;
      left: -180px;
      border-color: rgba(232, 117, 36, 0.16);
      box-shadow: 0 0 0 24px rgba(232, 117, 36, 0.035), 0 0 0 48px rgba(232, 117, 36, 0.035);
    }

    .hero {
      width: min(760px, 100%);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.2rem, 9vw, 6.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 1.04;
    }

    h1 span {
      display: block;
      color: var(--saffron);
    }

    .intro {
      max-width: 560px;
      margin: 26px auto 0;
      color: #625f56;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.8;
    }

    .welcome-link {
      display: inline-block;
      margin-top: 34px;
      padding: 14px 24px;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .welcome-link:hover {
      transform: translateY(-2px);
      background: #105d38;
    }

    .welcome-link:focus-visible {
      outline: 3px solid var(--navy);
      outline-offset: 4px;
    }

    footer {
      padding: 22px 24px;
      color: #706d64;
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      header {
        width: calc(100% - 32px);
        min-height: 76px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 0.85rem;
      }

      main {
        padding: 56px 20px 72px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="color-band" aria-hidden="true"></div>
    <header>
      <a class="brand" href="#" aria-label="India home">INDIA</a>
      <nav aria-label="Main navigation">
        <a href="#welcome">Welcome</a>
        <a href="#about">About</a>
      </nav>
    </header>
    <main id="welcome">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">A land of many wonders</p>
        <h1 id="page-title">Welcome <span>to India</span></h1>
        <p class="intro" id="about">
          Discover a vibrant tapestry of ancient traditions, breathtaking places,
          unforgettable flavors, and warm hospitality. Your journey starts here.
        </p>
        <a class="welcome-link" href="#about">Explore the spirit of India</a>
      </section>
    </main>
    <footer>Many cultures. One beautiful India.</footer>
  </div>
</body>
</html>
